root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/zen-todo ."
entrypoint = "./tmp/zen-todo"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["frontend/node_modules", "frontend/dist", "tmp", "bin"]
delay = 0
stop_on_error = true
send_interrupt = true
kill_delay = 1000

[proxy]
enabled = true
proxy_port = 3001
app_port = 3000


[log]
time = false

[misc]
clean_on_exit = true